  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

c\">Antecedentes<\u002Fspan><span style=\"font-weight:700;text-align:right\">HTA en tratamiento<\u002Fspan><\u002Fdiv>\n\n      <div style=\"font-size:12px;font-weight:700;letter-spacing:.09em;color:#7c828c;margin:18px 0 11px\">SIGNOS VITALES<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n        <sc-for list=\"{{ vitals }}\" as=\"v\" hint-placeholder-count=\"5\">\n          <div style=\"{{ v.boxStyle }}\">\n            <div style=\"font-size:11.5px;color:#7c828c;margin-bottom:3px\">{{ v.label }}<\u002Fdiv>\n            <div><span style=\"font-size:20px;font-weight:700\">{{ v.value }}<\u002Fspan> <span style=\"font-size:11.5px;color:#7c828c\">{{ v.unit }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px dashed rgba(0,0,0,.2);margin:20px 0 16px\"><\u002Fdiv>\n\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px\">\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:.09em;color:#565b63\">RECOMENDACIÓN IA<\u002Fspan>\n        <span style=\"font-size:12px;font-style:italic;color:#9aa0aa\">se actualiza en vivo<\u002Fspan>\n      <\u002Fdiv>\n\n      <div key=\"{{ analysisKey }}\" style=\"animation:fadeUp .5s ease both\">\n        <!-- level card -->\n        <div style=\"{{ recCardStyle }};border-radius:13px;padding:17px 20px;display:flex;align-items:center;gap:15px\">\n          <div style=\"{{ recDotStyle }};width:22px;height:22px;border-radius:50%;flex:none\"><\u002Fdiv>\n          <div>\n            <div style=\"{{ recInkStyle }};font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1\">{{ levelLabel }}<\u002Fdiv>\n            <div style=\"font-size:14px;color:#565b63;margin-top:4px\">{{ levelSub }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ overridden }}\" hint-placeholder-val=\"\">\n            <div style=\"margin-left:auto;font-size:11px;font-weight:600;color:#7c828c;text-align:right;line-height:1.3\">anulado<br>por clínico<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- confidence -->\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin:16px 0 7px\">\n          <span style=\"font-size:13.5px;font-weight:600\">Confianza<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:700;font-family:'IBM Plex Mono',monospace\">{{ confidence }}%<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative;height:13px;border-radius:7px;background:#dcdee3;overflow:hidden;border:1px solid rgba(0,0,0,.08)\">\n          <div style=\"height:100%;width:{{ confidencePct }};background:#262a30;border-radius:7px;transition:width .8s cubic-bezier(.4,0,.2,1)\"><\u002Fdiv>\n          <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9.2%,#f5f6f7 9.2%,#f5f6f7 10%)\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- reasoning -->\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:#565b63;margin:20px 0 9px\">RAZONAMIENTO CLÍNICO<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <sc-for list=\"{{ reasoning }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:10px;font-size:14.5px;line-height:1.45;color:#2e3138\"><span style=\"color:#a41f14;font-weight:700;flex:none\">›<\u002Fspan><span>{{ r }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- missing -->\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:#565b63;margin:20px 0 9px\">INFORMACIÓN FALTANTE<\u002Fdiv>\n        <sc-if value=\"{{ hasMissing }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <sc-for list=\"{{ missing }}\" as=\"mi\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:10px;font-size:14.5px;line-height:1.45;color:#2e3138\"><span style=\"width:6px;height:6px;border-radius:50%;border:1.6px solid #b98a2a;flex:none;margin-top:7px\"><\u002Fspan><span>{{ mi }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noMissing }}\" hint-placeholder-val=\"\">\n          <div style=\"font-size:14px;color:#2c7137;display:flex;gap:8px;align-items:center\">✓ Datos clave completos<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- next steps -->\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:#565b63;margin:20px 0 9px\">PRÓXIMOS PASOS<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <sc-for list=\"{{ nextSteps }}\" as=\"n\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:11px;font-size:14.5px;line-height:1.45;color:#2e3138\"><span style=\"font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:#7c828c;flex:none;margin-top:2px\">{{ n.num }}<\u002Fspan><span>{{ n.text }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- actions -->\n    <div style=\"flex:none;padding:14px 26px 20px;border-top:1px solid rgba(0,0,0,.09);background:#f5f6f7;position:relative\">\n      <sc-if value=\"{{ noteOpen }}\" hint-placeholder-val=\"\">\n        <div style=\"margin-bottom:12px;animation:fadeUp .2s ease\">\n          <textarea value=\"{{ note }}\" sc-camel-on-input=\"{{ onNote }}\" placeholder=\"Nota del clínico para este caso…\" style=\"width:100%;height:64px;resize:none;border:1.5px solid #d2d5da;border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;color:#262a30;background:#fbfbfc;outline:none\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ overrideOpen }}\" hint-placeholder-val=\"\">\n        <div style=\"position:absolute;left:26px;right:26px;bottom:118px;background:#fbfbfc;border:1.5px solid #262a30;border-radius:13px;padding:9px;box-shadow:0 12px 34px rgba(0,0,0,.2);z-index:15;animation:fadeUp .2s ease\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.06em;color:#7c828c;padding:6px 8px 8px\">ANULAR → SELECCIONA NIVEL MANCHESTER<\u002Fdiv>\n          <sc-for list=\"{{ levelOptions }}\" as=\"lv\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ lv.pick }}\" style=\"display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:9px;cursor:pointer\" style-hover=\"background:rgba(0,0,0,.05)\">\n              <span style=\"{{ lv.dotStyle }};width:16px;height:16px;border-radius:50%;flex:none\"><\u002Fspan>\n              <span style=\"{{ lv.inkStyle }};font-weight:700;font-size:15px;width:82px\">{{ lv.label }}<\u002Fspan>\n              <span style=\"font-size:13px;color:#7c828c\">{{ lv.sub }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <button sc-camel-on-click=\"{{ accept }}\" style=\"{{ acceptBtnStyle }};width:100%;padding:15px;border-radius:12px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px\">{{ acceptLabel }}<\u002Fbutton>\n      <div style=\"display:flex;gap:10px\">\n        <button sc-camel-on-click=\"{{ toggleOverride }}\" style=\"flex:1;padding:13px;border-radius:11px;border:1.5px solid #d2d5da;background:#f7f8f9;font-family:inherit;font-size:14.5px;font-weight:600;color:#2e3138;cursor:pointer\" style-hover=\"background:#e9ebee\">⇄ Anular…<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ toggleNote }}\" style=\"flex:1;padding:13px;border-radius:11px;border:1.5px solid #d2d5da;background:#f7f8f9;font-family:inherit;font-size:14.5px;font-weight:600;color:#2e3138;cursor:pointer\" style-hover=\"background:#e9ebee\">+ Nota<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;860px&quot;},&quot;defaultLevel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rojo&quot;,&quot;naranja&quot;,&quot;amarillo&quot;,&quot;verde&quot;,&quot;azul&quot;],&quot;default&quot;:&quot;rojo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Triage&quot;},&quot;thinkingMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:400,&quot;max&quot;:3000,&quot;step&quot;:100,&quot;default&quot;:1600,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Comportamiento&quot;}}\">\nclass Component extends DCLogic {\n  LEVELS = {\n    rojo:    {label:'ROJO',    sub:'Atención inmediata', ink:'#a41f14', dot:'#c0271a', cardBg:'#fceeeb', cardBd:'#e6a89f', aBg:'#f6d8d3', aBd:'#dca69f', aInk:'#8f1d12'},\n    naranja: {label:'NARANJA', sub:'Muy urgente',        ink:'#b0560f', dot:'#d06a15', cardBg:'#fdf2e8', cardBd:'#eec7a3', aBg:'#f8e6d3', aBd:'#e2be96', aInk:'#95490c'},\n    amarillo:{label:'AMARILLO',sub:'Urgente',            ink:'#876706', dot:'#c99a0a', cardBg:'#fbf6e2', cardBd:'#e6d68e', aBg:'#f4edcf', aBd:'#d9c98a', aInk:'#6f5504'},\n    verde:   {label:'VERDE',   sub:'Estándar',           ink:'#2c7137', dot:'#3f9a4d', cardBg:'#edf6ee', cardBd:'#a9d3af', aBg:'#dcefdd', aBd:'#a3ceaa', aInk:'#215c2a'},\n    azul:    {label:'AZUL',    sub:'No urgente',         ink:'#2a6493', dot:'#3b83bd', cardBg:'#eaf3fa', cardBd:'#a6c9e5', aBg:'#d9eaf6', aBd:'#a0c6e3', aInk:'#1f5079'},\n  };\n  ORDER = ['rojo','naranja','amarillo','verde','azul'];\n  INITIAL_MISSING = 3;\n\n  state = {\n    input: '', analyzing: false, accepted: false, overridden: false,\n    overrideOpen: false, noteOpen: false, note: '', toast: null,\n    levelKey: 'rojo', confidence: 0, analysisKey: 1,\n    messages: [\n      {isNurse:true, lang:'EN', text:'Varón de 58 años, dolor torácico opresivo desde hace 40 min, irradiado a brazo izquierdo, con sudoración y disnea.'},\n      {isAi:true, title:'Falta información', text:'¿Antecedentes cardíacos o medicación habitual? ¿Cifras de TA y SatO₂ actuales?'},\n      {isNurse:true, lang:'EN', text:'HTA en tratamiento. TA 90/60, FC 110, SatO₂ 92%. Adjunto informe de ambulancia.', hasAttachments:true, attachments:['Informe_ambulancia.pdf','Lab_urgencias.pdf']},\n      {isAi:true, title:'Recomendación lista', link:true, text:'He analizado el caso. La recomendación aparece en el panel derecho. Sigo atenta a nuevos datos.'},\n    ],\n    reasoning: [\n      'Dolor opresivo irradiado a brazo izq. + diaforesis + disnea → sospecha de SCA',\n      'Hipotensión (90/60) y taquicardia (110) → posible compromiso hemodinámico',\n      'SatO₂ 92% → hipoxemia leve',\n    ],\n    missing: ['ECG de 12 derivaciones pendiente','Troponina no disponible','Alergias sin confirmar'],\n    nextSteps: [\n      'Activar código dolor torácico + monitorización',\n      'ECG inmediato + analítica con troponina',\n      'Vía IV + O₂ suplementario',\n    ],\n  };\n\n  componentDidMount(){\n    const lv = this.props.defaultLevel;\n    if(lv && this.LEVELS[lv]) this.setState({levelKey: lv});\n    this.animateConfidence(88);\n  }\n  componentWillUnmount(){ cancelAnimationFrame(this._raf); clearTimeout(this._t); clearTimeout(this._toast); }\n\n  animateConfidence(target){\n    cancelAnimationFrame(this._raf);\n    const from = this.state.confidence, start = performance.now(), dur = 900;\n    const tick = (now) => {\n      const t = Math.min(1,(now-start)/dur), e = 1-Math.pow(1-t,3);\n      this.setState({confidence: Math.round(from+(target-from)*e)});\n      if(t<1) this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  showToast(msg){ this.setState({toast:msg}); clearTimeout(this._toast); this._toast=setTimeout(()=>this.setState({toast:null}),2800); }\n\n  onInput = (e)=> this.setState({input:e.target.value});\n  onNote = (e)=> this.setState({note:e.target.value});\n  onKey = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); this.send(); } };\n\n  send = ()=>{\n    const text = this.state.input.trim();\n    if(!text || this.state.analyzing) return;\n    this.setState(s=>({messages:[...s.messages,{isNurse:true,lang:'EN',text}], input:'', analyzing:true}));\n    const delay = this.props.thinkingMs || 1600;\n    clearTimeout(this._t);\n    this._t = setTimeout(()=>{\n      const t = text.toLowerCase();\n      let missing = [...this.state.missing];\n      let reasoning = [...this.state.reasoning];\n      const added = [];\n      const drop = (needle, label, reason)=>{\n        const i = missing.findIndex(m=>m.toLowerCase().includes(needle));\n        if(t.includes(needle) && i>=0){ missing.splice(i,1); added.push(label); if(reason) reasoning=[...reasoning,reason]; }\n      };\n      drop('ecg','ECG','ECG registrado → integrado en la valoración de SCA');\n      drop('troponina','troponina','Resultado de troponina incorporado al análisis');\n      drop('alergia','alergias');\n      const conf = Math.min(97, 88 + (this.INITIAL_MISSING - missing.length)*3);\n      const reply = added.length\n        ? `Registrado. He actualizado el panel: ${added.join(', ')}. La confianza sube a ${conf}%.`\n        : 'He incorporado el dato al análisis. El panel derecho refleja el cambio.';\n      this.setState(s=>({\n        analyzing:false, missing, reasoning, analysisKey:s.analysisKey+1, confidence:0,\n        messages:[...s.messages,{isAi:true, title:'Análisis actualizado', link:true, text:reply}],\n      }));\n      this.animateConfidence(conf);\n    }, delay);\n  };\n\n  accept = ()=>{\n    const L = this.LEVELS[this.state.levelKey];\n    this.setState({accepted:true, overrideOpen:false});\n    this.showToast(`Triage confirmado · ${L.label}`);\n  };\n  toggleOverride = ()=> this.setState(s=>({overrideOpen:!s.overrideOpen, noteOpen:false}));\n  toggleNote = ()=> this.setState(s=>({noteOpen:!s.noteOpen, overrideOpen:false}));\n  pickLevel = (key)=>{\n    const L = this.LEVELS[key];\n    this.setState({levelKey:key, overridden:true, accepted:false, overrideOpen:false, analysisKey:this.state.analysisKey+1});\n    this.showToast(`Nivel anulado → ${L.label}`);\n  };\n\n  renderVals(){\n    const s = this.state, L = this.LEVELS[s.levelKey];\n    const vitalBox = (tone)=>{\n      const map = {\n        crit:'background:#fceeeb;border:1.5px solid #e6a89f',\n        warn:'background:#fbf6e2;border:1.5px solid #e6d68e',\n        ok:  'background:#f7f8f9;border:1.5px solid #d2d5da',\n      };\n      return `${map[tone]};border-radius:10px;padding:10px 12px`;\n    };\n    const vitals = [\n      {label:'TA', value:'90/60', unit:'mmHg', boxStyle:vitalBox('crit')},\n      {label:'FC', value:'110', unit:'lpm', boxStyle:vitalBox('crit')},\n      {label:'SatO₂', value:'92%', unit:'', boxStyle:vitalBox('crit')},\n      {label:'FR', value:'24', unit:'rpm', boxStyle:vitalBox('warn')},\n      {label:'Tª', value:'36.8', unit:'°C', boxStyle:vitalBox('ok')},\n    ];\n    const levelOptions = this.ORDER.map(k=>{\n      const lv = this.LEVELS[k];\n      return {label:lv.label, sub:lv.sub, dotStyle:`background:${lv.dot}`, inkStyle:`color:${lv.ink}`, pick:()=>this.pickLevel(k)};\n    });\n    return {\n      messages: s.messages,\n      analyzing: s.analyzing,\n      toast: s.toast,\n      input: s.input,\n      note: s.note,\n      noteOpen: s.noteOpen,\n      overrideOpen: s.overrideOpen,\n      overridden: s.overridden,\n      analysisKey: s.analysisKey,\n      vitals,\n      reasoning: s.reasoning,\n      missing: s.missing,\n      hasMissing: s.missing.length>0,\n      noMissing: s.missing.length===0,\n      nextSteps: s.nextSteps.map((text,i)=>({num:String(i+1).padStart(2,'0'), text})),\n      confidence: s.confidence,\n      confidencePct: s.confidence + '%',\n      levelLabel: L.label,\n      levelSub: L.sub,\n      levelOptions,\n      recCardStyle: `background:${L.cardBg};border:1.5px solid ${L.cardBd}`,\n      recDotStyle: `background:${L.dot}`,\n      recInkStyle: `color:${L.ink}`,\n      acceptBtnStyle: s.accepted\n        ? `background:#e2e4e8;border:1.5px solid #b7bcc4;color:#565b63`\n        : `background:${L.aBg};border:1.5px solid ${L.aBd};color:${L.aInk}`,\n      acceptLabel: s.accepted ? `✓ ${L.label} confirmado` : `✓ Aceptar ${L.label}`,\n      analyzeLabel: s.analyzing ? 'Analizando…' : 'En seguimiento',\n      analyzeDot: s.analyzing ? '#c0271a' : '#3f9a4d',\n      analyzeAnim: s.analyzing ? 'softpulse 1s ease infinite' : 'none',\n      send:this.send, accept:this.accept, toggleOverride:this.toggleOverride, toggleNote:this.toggleNote,\n      onInput:this.onInput, onNote:this.onNote, onKey:this.onKey,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
